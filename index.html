<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtubes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-inicio">
            <i class="fa-solid fa-bars"></i>

            <div class="logotipo">
                <i class="fa-brands fa-youtube logotipo-icone"></i>
                <span class="logotipo-texto">Youtubes</span>
                <span class="logotipo-pais">BR</span>
            </div>
        </div>

        <div class="cabecalho-centro">
            <div class="search">
                <input type="text" name="search" id="search-input" class="search-input">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button class="microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <div class="cabecalho-final">
            <button class="logotipo-video" title="Criar">
                <i class="fa-solid fa-video"></i>
            </button>
            <button class="logotipo-video" title="Notificações">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button class="logotipo-video" title="Sua conta">R</button>
        </div>
    </header>

    <main class="principal">
        <div class="princ-sidebar">a</div>
        <div class="princ-video">a</div>
        <div class="princ-recomendados">a</div>
    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
